name: taskbreakdown
description: "Break down your tasks into tiny manageable pieces."
publish_to: "none"
version: 1.0.0+7

environment:
    sdk: ^3.5.4

dependencies:
    flutter:
        sdk: flutter
    animated_tree_view: ^2.3.0
    speech_to_text: ^7.0.0
    google_generative_ai: ^0.4.6
    uuid: ^4.5.1
    shared_preferences: ^2.3.4
    google_mobile_ads: ^5.2.0
    provider: ^6.1.2
    firebase_core: ^3.9.0
    firebase_vertexai: ^1.0.4
    fluttertoast: ^8.2.10
    flutter_inapp_purchase: ^5.6.1
    get_storage: ^2.1.1
    http: ^1.2.2
    url_launcher: ^6.3.1
    flutter_launcher_icons: ^0.14.3

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^4.0.0

flutter:
    uses-material-design: true
